<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Persutilastot</title>
<meta name="description" content="Suomen viralliset rikostilastot — Tilastokeskus & Rise">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#0d0f12;--bg2:#141720;--bg3:#1c2030;--border:rgba(255,255,255,0.09);--text:#e8eaf0;--muted:#7a8099;--dim:#4a5068;--accent:#4f8ef7;--red:#e05c5c;--green:#3dba8c;--amber:#e8a23a;--purple:#9b7de8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;padding-bottom:72px;}

/* TOP BAR */
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar h1{font-size:15px;font-weight:600;}
.topbar small{font-size:11px;color:var(--muted);}

/* BOTTOM NAV */
.botnav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);display:flex;overflow-x:auto;z-index:100;-webkit-overflow-scrolling:touch;}
.botnav::-webkit-scrollbar{display:none;}
.bn{flex:0 0 auto;padding:10px 14px 12px;text-align:center;cursor:pointer;color:var(--dim);font-size:10px;min-width:64px;border:none;background:none;transition:color .15s;}
.bn.active{color:var(--accent);}
.bn-dot{width:6px;height:6px;border-radius:50%;margin:0 auto 4px;}

/* CONTENT */
.content{padding:14px;}
.panel{display:none;}
.panel.active{display:block;}

/* METRIC CARDS */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.mc{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:13px 14px;}
.mc3{grid-column:1/-1;}
.mlabel{font-size:10px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;}
.mval{font-size:24px;font-weight:300;line-height:1;margin-bottom:3px;}
.mval.r{color:var(--red);}
.mval.g{color:var(--green);}
.mval.a{color:var(--accent);}
.msub{font-size:11px;color:var(--dim);}
.tu{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;background:rgba(224,92,92,.12);color:var(--red);}
.td{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;background:rgba(61,186,140,.12);color:var(--green);}

/* CARD */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
.ctitle{font-size:13px;font-weight:500;margin-bottom:3px;}
.csub{font-size:11px;color:var(--muted);margin-bottom:12px;}

/* PURE CSS LINE CHART */
.linechart{position:relative;height:160px;margin:4px 0;}
.lc-svg{width:100%;height:100%;}

/* BAR CHART (horizontal) */
.barchart{display:flex;flex-direction:column;gap:7px;margin-top:4px;}
.bc-row{display:flex;align-items:center;gap:8px;}
.bc-label{font-size:11px;color:var(--muted);min-width:80px;flex-shrink:0;}
.bc-track{flex:1;height:8px;background:var(--border);border-radius:3px;overflow:hidden;}
.bc-fill{height:100%;border-radius:3px;transition:width .5s ease;}
.bc-val{font-size:11px;color:var(--text);min-width:44px;text-align:right;flex-shrink:0;}

/* STACKED BAR */
.sbarchart{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
.sbc-row{display:flex;align-items:center;gap:8px;}
.sbc-label{font-size:10px;color:var(--muted);min-width:32px;flex-shrink:0;text-align:center;}
.sbc-track{flex:1;height:14px;background:var(--border);border-radius:3px;overflow:hidden;display:flex;}
.sbc-seg{height:100%;}

/* LEGEND */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
.ld{width:10px;height:10px;border-radius:2px;flex-shrink:0;}

/* INFO BOX */
.ibox{background:rgba(79,142,247,.06);border:1px solid rgba(79,142,247,.2);border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:12px;color:var(--muted);line-height:1.6;}
.ibox.amber{background:rgba(232,162,58,.06);border-color:rgba(232,162,58,.25);}
.ibox strong{color:var(--text);font-weight:500;}
.dbox{background:rgba(74,80,104,.15);border:1px solid rgba(122,128,153,.2);border-radius:8px;padding:9px 13px;margin-bottom:14px;font-size:11px;color:var(--dim);line-height:1.5;display:flex;align-items:flex-start;gap:7px;}
.dbox-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex-shrink:0;margin-top:3px;}
.abox{background:var(--bg3);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:11px 14px;margin-top:12px;font-size:12px;color:var(--muted);line-height:1.7;}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.comp-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;}
.comp-num{font-size:32px;font-weight:300;line-height:1;margin-bottom:3px;}
.comp-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin:6px 0 4px;}
.comp-fill{height:100%;border-radius:3px;}
.comp-note{font-size:11px;color:var(--dim);}
.landing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 140px);text-align:center;padding:20px;}
.landing-logo{margin-bottom:24px;}
.landing h2{font-size:32px;font-weight:700;letter-spacing:-.5px;margin-bottom:8px;background:linear-gradient(135deg,#4f8ef7,#e05c5c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.landing .tagline{font-size:14px;color:var(--muted);margin-bottom:28px;max-width:300px;line-height:1.6;}
.landing .start-btn{background:linear-gradient(135deg,#4f8ef7,#3d6fd9);color:#fff;border:none;border-radius:12px;padding:14px 32px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 20px rgba(79,142,247,.3);}
.landing .start-btn:active{transform:scale(.97);}
.landing .credits{margin-top:32px;font-size:11px;color:var(--dim);line-height:1.7;}
.landing .credits strong{color:var(--muted);}
.home-wrap{max-width:900px;margin:0 auto;padding:0 16px 32px;display:flex;flex-direction:column;gap:26px;text-align:left}
.home-sec{display:flex;flex-direction:column;gap:10px}
.home-head{display:flex;justify-content:space-between;align-items:baseline}
.home-head h2{font-size:17px;font-weight:700;margin:0}
.home-head button{background:none;border:none;font:inherit;font-size:12px;color:#7fb0ff;cursor:pointer;padding:8px 0}
.home-sec h3{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:0}
.home-top{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;color:var(--text);text-align:left;cursor:pointer;font:inherit;width:100%}
.ht-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ht-rank{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ht-name{font-size:15px;font-weight:600}
.ht-sub{font-size:12px;color:var(--muted)}
.ht-note{font-size:11px;color:var(--amber)}
.ht-src{font-size:11px;color:var(--muted)}
.ht-txt{font-size:12px;color:var(--text)}
.tl-txt{font-size:11px;color:var(--text);opacity:.85;line-height:1.35}
.tulkinta{border-left:3px solid var(--accent)}
.ht-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ht-pct{font-size:26px;font-weight:700;line-height:1}
.home-fine{font-size:11px;color:var(--muted)}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.home-tile{display:flex;flex-direction:column;gap:6px;padding:12px;min-height:92px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;color:var(--text);text-align:left;cursor:pointer;font:inherit}
.home-tile:hover,.home-top:hover{border-color:rgba(255,255,255,.22)}
.tl-name{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.tl-dot{width:8px;height:8px;border-radius:50%;flex:none}
.tl-val{font-size:19px;font-weight:700;margin-top:auto}
.tl-sub{font-size:11px;color:var(--muted)}
.tl-sub.up{color:#f07a7a}.tl-sub.down{color:#4fd1a0}
.home-credits{font-size:11px;color:var(--muted);text-align:center;line-height:1.7}
.pnav{max-width:560px;margin:8px auto 24px;padding:0 16px}
.pnav-pos{font-size:11px;color:var(--muted);text-align:center;margin-bottom:8px}
.pnav-row{display:flex;gap:10px}
.pnav-row button{flex:1;min-height:44px;border-radius:10px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font:inherit;font-size:13px;cursor:pointer}
</style>
</head>

  <button class="bn" data-p="huumeet" onclick="go(this)"><div class="bn-dot" style="background:#8fb84a"></div>Huumeet</button>

  <button class="bn" data-p="vangit" onclick="go(this)"><div class="bn-dot" style="background:#9b7de8"></div>Vangit</button>
  <button class="bn" data-p="syntyperä" onclick="go(this)"><div class="bn-dot" style="background:#e8a23a"></div>Kansalaiset vangeissa</button>

<script>
const TITLES={home:'Persutilastot',vakivalta:'Pahoinpitelyrikokset',seksuaali:'Seksuaalirikokset',henki:'Henkirikokset',ryostot:'Ryöstöt',varkaudet:'Varkausrikokset',huumeet:'Huumausainerikokset',nuoriso:'Nuorisorikollisuus',perhe:'Perhe- ja lähisuhdeväkivalta',maahanmuuttajat:'Ulkomaalaistaustaiset vs. suomalaistaustaiset',kansalaisuus:'Kansalaisuuksittain',vangit:'Ulkomaalaiset vangit','syntyperä':'Ulkomaan kansalaiset vangeissa',ennakko2025:'Ennakkotiedot',ika:'Ikäjakauma & tausta',tyottomyys:'Nuorisotyöttömyys',eurostat:'EU-vertailu: turvallisuus asuinalueella',kasvu:'Eniten kasvaneet tilastot',ulkkasvu:'Ulkomaalaiset ja kasvavat rikokset'};
const Y=['2016','2017','2018','2019','2020','2021','2022','2023','2024','2025'];
// Vaestoosuudet, joita seka vangit- etta syntyperapaneeli kayttavat
const EU=[25857,25546,27170,27942,32653,35062,35055,41092,46697,51438];
const ES=[266978,254763,253304,255449,292662,287851,260021,310625,269600,296319];
// Pitka aikasarja taulusta rpk/13ex (1980-). Luvut ovat per 100 000 asukasta,
// jotta vaestonkasvu ei vaaristaisi vertailua.
const LTY0='2000';
const LTL=['Rikoslakirikokset yhteensä','Omaisuusrikokset','Väkivaltarikokset','Seksuaalirikokset','Henkirikokset'];
const LT0=[10292.70,6041.20,586.90,24.80,2.80];   // per 100k, lahtovuosi 1
const LTY2='2010';
const LT2=[9401.5,4601.2,664.4,45.0,2.0];    // per 100k, lahtovuosi 2
// Kuinka vertailukelpoinen pitka sarja on. Perustuu siihen, nakyyko
// lainsaadannon tai kirjaamisen muutos sarjassa yhden vuoden hyppayksena.
const LTV=['hyvä','hyvä','varauksin — lievien pahoinpitelyjen syyteoikeus muuttui 2011 (+20 % yhdessä vuodessa)','heikko — seksuaalirikoslaki uudistui 2023 (+33 % yhdessä vuodessa)','paras — määritelmä ei ole muuttunut'];
const LT1=[9792.10,4728.10,852.00,183.50,1.40];   // per 100k, viimeisin vuosi
const VKS=7.7;   // ulkomaan kansalaisten vaestoosuus, %
const VSS=10.9;  // ulkomailla syntyneiden vaestoosuus, %

function fi(n){return Math.round(n).toLocaleString('fi-FI');}

// ── SVG LINE CHART ──────────────────────────────────────
// Pienimman neliosumman suora. Palauttaa sovitetut arvot, kulmakertoimen
// (muutos vuodessa) ja selitysasteen, jotta kayran voi myos sanallistaa.
function trendi(arr){
  const n=arr.length, xs=arr.map((_,i)=>i);
  const mx=xs.reduce((a,b)=>a+b,0)/n, my=arr.reduce((a,b)=>a+b,0)/n;
  let sxy=0, sxx=0;
  for(let i=0;i<n;i++){ sxy+=(xs[i]-mx)*(arr[i]-my); sxx+=(xs[i]-mx)**2; }
  const k=sxx?sxy/sxx:0, b=my-k*mx;
  const fit=xs.map(x=>k*x+b);
  let ss=0, st=0;
  for(let i=0;i<n;i++){ ss+=(arr[i]-fit[i])**2; st+=(arr[i]-my)**2; }
  return {fit:fit, k:k, r2:st?1-ss/st:0};
}

function lineTrend(data,color,yMin,yMax,yFmt,labels,opts){
  const o=opts||{}, t=trendi(data);
  const fit=t.fit.map(v=>Math.min(yMax,Math.max(yMin,v)));
  const svg=lineChart([{data:fit,color:o.tc||'#7a8099',fill:false,width:1.5,dash:'6,4'}]
    .concat(o.extra||[])
    .concat([{data:data,color:color,fill:o.fill!==false,width:o.width||2}]),
    yMin,yMax,yFmt,labels);
  const k=Math.abs(t.k);
  const ks=(t.k>=0?'+':'−')+(o.dec?k.toFixed(o.dec).replace('.',','):fi(Math.round(k)));
  return svg+'<div class="csub" style="margin-top:8px">Katkoviiva on pienimmän neliösumman '
    +'trendisuora: keskimäärin '+ks+' '+(o.unit||'')+' vuodessa, selitysaste '
    +(t.r2*100).toFixed(0)+' %. Suora tiivistää suunnan, se ei ole ennuste.</div>';
}

function lineChart(datasets, yMin, yMax, yFmt, labels){
  const XL=labels||Y;
  const W=340,H=140,PL=46,PR=10,PT=10,PB=24;
  const cW=W-PL-PR, cH=H-PT-PB;
  const xStep=cW/(datasets[0].data.length-1);
  const yRange=yMax-yMin;
  function px(i){return PL+i*xStep;}
  function py(v){return PT+cH-(v-yMin)/yRange*cH;}

  let paths='';
  datasets.forEach(d=>{
    const pts=d.data.map((v,i)=>px(i)+','+py(v)).join(' ');
    if(d.fill){
      const first=d.data[0],last=d.data[d.data.length-1];
      paths+=`<polygon points="${PL},${PT+cH} ${pts} ${px(d.data.length-1)},${PT+cH}" fill="${d.color}18"/>`;
    }
    paths+=`<polyline points="${pts}" fill="none" stroke="${d.color}" stroke-width="${d.width||2}" stroke-dasharray="${d.dash||''}" stroke-linejoin="round"/>`;
    // last point dot
    const li=d.data.length-1;
    paths+=`<circle cx="${px(li)}" cy="${py(d.data[li])}" r="4" fill="${d.color}"/>`;
  });

  // y axis labels
  let yLabels='';
  const steps=4;
  for(let i=0;i<=steps;i++){
    const v=yMin+(yRange/steps)*i;
    const y=py(v);
    yLabels+=`<text x="${PL-4}" y="${y+4}" text-anchor="end" font-size="10" fill="#7a8099">${yFmt?yFmt(v):fi(v)}</text>`;
    yLabels+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>`;
  }

  // x axis labels — show every other
  let xLabels='';
  XL.forEach((yr,i)=>{
    if((i%2===0&&!(XL.length>10&&i===XL.length-2))||i===XL.length-1){
      xLabels+=`<text x="${px(i)}" y="${H-4}" text-anchor="middle" font-size="10" fill="#7a8099">${yr}</text>`;
    }
  });

  return `<div class="linechart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%">${yLabels}${xLabels}${paths}</svg></div>`;
}

// ── HORIZONTAL BAR CHART ────────────────────────────────
function hbars(rows){
  const max=Math.max(...rows.map(r=>r.v));
  return '<div class="barchart">'+rows.map(r=>`
  <div class="bc-row">
    <span class="bc-label">${r.l}</span>
    <div class="bc-track"><div class="bc-fill" style="width:${(r.v/max*100).toFixed(1)}%;background:${r.c}"></div></div>
    <span class="bc-val">${r.fmt||fi(r.v)}</span>
  </div>`).join('')+'</div>';
}

// ── STACKED BARS ────────────────────────────────────────
function stackedBars(years, datasets){
  const totals=years.map((_,i)=>datasets.reduce((s,d)=>s+d.data[i],0));
  const maxT=Math.max(...totals);
  return '<div class="sbarchart">'+years.map((yr,i)=>{
    const segs=datasets.map(d=>`<div class="sbc-seg" style="width:${(d.data[i]/maxT*100).toFixed(1)}%;background:${d.color}aa"></div>`).join('');
    return`<div class="sbc-row"><span class="sbc-label">${yr}</span><div class="sbc-track">${segs}</div></div>`;
  }).join('')+'</div>';
}

function goHome(){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('p-home').classList.add('active');
  document.getElementById('ttitle').textContent='Persutilastot';
  document.getElementById('back-btn').style.display='none';
  const pnh=document.getElementById('pnav'); if(pnh) pnh.style.display='none';
  document.getElementById('botnav').style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});
}

function go(el){
  document.querySelectorAll('.bn').forEach(b=>b.classList.remove('active'));
  if(el) el.classList.add('active');
  const id=el?el.dataset.p:null;
  if(!id) return;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('p-'+id).classList.add('active');
  document.getElementById('ttitle').textContent=TITLES[id]||id;
  document.getElementById('back-btn').style.display='block';
  document.getElementById('botnav').style.display='none';
  const pn=document.getElementById('pnav'); if(pn){ pn.innerHTML=panelNav(id); pn.style.display=pn.innerHTML?'block':'none'; }
  window.scrollTo({top:0,behavior:'smooth'});
  const panel=document.getElementById('p-'+id);
  if(!panel.dataset.done){
    panel.dataset.done='1';
    render(id);
  }
  addTulkinta(id);
}

function render(id){
  if(['vakivalta','henki','ryostot','nuoriso','varkaudet','huumeet'].includes(id)) renderCrime(id);
  else if(id==='seksuaali') renderSeksuaali();
  else if(id==='perhe') renderPerhe();
  else if(id==='maahanmuuttajat') renderMaahanmuuttajat();
  else if(id==='kansalaisuus') renderKansalaisuus();
  else if(id==='vangit') renderVangit();
  else if(id==='syntyperä') renderSyntyperä();
  else if(id==='ennakko2025') renderEnnakko2025();
  else if(id==='ika') renderIka();
  else if(id==='tyottomyys') renderTyottomyys();
  else if(id==='eurostat') renderEurostat();
  else if(id==='kasvu') renderKasvu();
  else if(id==='ulkkasvu') renderUlkKasvu();
}

async function eusRefresh(){
  try{
    const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),6000);
    const j=await fetch(EUS_API,{signal:ctl.signal}).then(r=>r.json()); clearTimeout(t);
    const gi=j.dimension.geo.category.index, ti=j.dimension.time.category.index;
    const T=Object.keys(ti).sort((a,b)=>ti[a]-ti[b]); const n=T.length;
    const yrs=T.filter(y=>+y>=2016 && j.value[gi.FI*n+ti[y]]!=null);
    if(!yrs.length) return false;
    const v={}; Object.keys(EUS_NAMES).concat(['EU27_2020']).forEach(g=>{ if(gi[g]==null) return; v[g]=yrs.map(y=>{const x=j.value[gi[g]*n+ti[y]]; return x==null?null:x;}); });
    const d=(j.updated||'').slice(0,10).split('-'); EUS={updated:d.length===3?(+d[2])+'.'+(+d[1])+'.'+d[0]:EUS.updated,years:yrs,v};
    return true;
  }catch(e){ return false; }
}

// ── AUTOMAATTINEN TULKINTA ──────────────────────────────
// Kirjoittaa lyhyen tulkinnan sarjan pitkasta ja lyhyesta kehityksesta,
// jotta yksittaisen vuoden muutos ei anna vaaraa kuvaa. Lasketaan aina
// sivun ajantasaisista luvuista.
function trendText(a,yrs){
  if(!a||a.length<3) return '';
  var n=a.length, y0=yrs[yrs.length-n]||yrs[0], last=a[n-1], first=a[0];
  var lg=(last-first)/first*100, mx=Math.max.apply(null,a), pk=a.indexOf(mx), pkY=yrs[yrs.length-n+pk];
  var p1=Math.abs(lg)<10?'Suunnilleen samalla tasolla kuin '+y0:(lg>0?'Selvästi enemmän kuin '+y0+' (+'+lg.toFixed(0)+' %)':'Selvästi vähemmän kuin '+y0+' (−'+Math.abs(lg).toFixed(0)+' %)');
  var down=0,up=0; for(var i=n-1;i>0&&a[i]<a[i-1];i--) down++; for(var j=n-1;j>0&&a[j]>a[j-1];j--) up++;
  var p2, dir;
  if(pk===n-1){p2='koko jakson korkein taso'; dir=1;}
  else if(down>=2){p2='laskenut '+down+' vuotta peräkkäin vuoden '+pkY+' huipusta'; dir=-1;}
  else if(up>=2){p2='kasvanut '+up+' vuotta peräkkäin'; dir=1;}
  else if(down===1){p2='laskenut edellisvuodesta'; dir=-1;}
  else {p2='noussut edellisvuodesta'; dir=1;}
  var conn=(Math.abs(lg)>=10&&((lg>0&&dir<0)||(lg<0&&dir>0)))?', mutta ':', ';
  var t=p1+conn+p2+'.';
  if(mx<200) t+=' Pienet luvut vaihtelevat paljon vuodesta toiseen.';
  return t;
}

  return null;

  el.innerHTML=
    '<div class="dbox"><div class="dbox-dot"></div><span><strong>Ajanjakso: '+y0+'–'+y1+'</strong> — Selvitettyihin rikoksiin syylliseksi epäillyt. Kukin epäilty lasketaan kerran kussakin rikosryhmässä.<br><span style="opacity:.7">Lähde: Tilastokeskus, StatFin-taulut rpk/13zk (syntyperä) ja rpk/13je (kansalaisuus), väestö vaerak/159s</span></span></div>'+

// ── 2025 ENNAKKOTIEDOT ───────────────────────────────────
// Lähde: Tilastokeskus, rikos- ja pakkokeinotilasto 2025 Q3 (julk. 17.10.2025)
// Rullaava ennakkojakso taulusta rpk/13j2 — ei vertailukelpoinen koko vuoden tilastoihin
function renderEnnakko2025(){
  const el=document.getElementById('p-ennakko2025');

  // Rullaava ennakkovertailu: kuluva vuosi alusta viimeisimpaan
  // julkaistuun kuukauteen, verrattuna edellisen vuoden samaan jaksoon.
  // Luvut haetaan taulusta rpk/13j2 (ennakkotieto, kumulatiivinen vuosisumma).
  const ENL=['Pahoinpitelyt','Raiskaukset','Lapsiin kohdistuvat','Seksuaalinen ahdistelu','Henkirikokset','Ryöstöt','Varkaudet'];
  const ENCOL=['#e05c5c','#e8a23a','#e06898','#9b7de8','#8fb84a','#4f8ef7','#3dba8c'];
  const ENC=[36511,1526,2922,1161,56,1834,112193];
  const ENP=[32989,1572,2176,1047,56,1744,109971];
  const ENPER='1–9/2026';
  const ENPERP='1–9/2025';
  const cats=ENL.map((l,i)=>({l,v25:ENC[i],v24:ENP[i],c:ENCOL[i],note:''}))
    .filter(c=>c.v25>0&&c.v24>0);

  const maxV=Math.max(...cats.map(c=>Math.max(c.v25,c.v24)));

  const rows=cats.map(c=>{
    const chg=((c.v25-c.v24)/c.v24*100);
    const chgTxt=(chg>0?'+':'')+chg.toFixed(1)+'%';
    const chgCol=chg>0?'var(--red)':'var(--green)';
    return`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
        <span style="font-size:13px;font-weight:500">${c.l}</span>
        <span style="font-size:15px;font-weight:500;color:${chgCol}">${chgTxt}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
        <div>
          <div style="font-size:10px;color:var(--muted);margin-bottom:3px">${ENPERP}</div>
          <div style="height:8px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:3px">
            <div style="height:100%;width:${(c.v24/maxV*100).toFixed(1)}%;background:${c.c}55;border-radius:3px"></div>
          </div>
          <div style="font-size:12px;color:var(--muted)">${fi(c.v24)}</div>
        </div>
        <div>
          <div style="font-size:10px;color:var(--muted);margin-bottom:3px">${ENPER}</div>
          <div style="height:8px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:3px">
            <div style="height:100%;width:${(c.v25/maxV*100).toFixed(1)}%;background:${c.c};border-radius:3px"></div>
          </div>
          <div style="font-size:12px;font-weight:500">${fi(c.v25)}</div>
        </div>
      </div>
      <div style="font-size:11px;color:var(--dim)">${c.note}</div>
    </div>`;
  }).join('');

  el.innerHTML=`
  <div class="ibox amber">
    <strong>Huomio: ennakkotieto, osavuosi</strong> — Nämä luvut kattavat jakson ${ENPER} ja niitä verrataan edellisen vuoden samaan jaksoon (${ENPERP}). Ne eivät ole vertailukelpoisia dashboardin vuositilastoihin (${Y[0]}–${Y[9]}), jotka kattavat koko vuoden. Ennakkotieto voi myös tarkentua lopullisessa tilastossa.</div>
  <div style="font-size:11px;color:var(--dim);margin-bottom:14px">Lähde: Tilastokeskus, rikos- ja pakkokeinotilasto, ennakkotieto (taulu rpk/13j2)</div>
  ${rows}
  <div class="abox">Jaksolla ${ENPER} suurin suhteellinen muutos edellisvuoden vastaavaan jaksoon nähden oli ${(()=>{let bi=0,bv=0;for(let i=0;i<ENC.length;i++){if(!ENP[i])continue;const c=(ENC[i]-ENP[i])/ENP[i]*100;if(Math.abs(c)>Math.abs(bv)){bv=c;bi=i;}}return ENL[bi].toLowerCase()+" ("+(bv>=0?"+":"")+bv.toFixed(1)+" %)";})()}. Ennakkotiedot perustuvat rikosilmoituksen kirjaamisajankohtaan ja voivat tarkentua lopullisessa tilastossa, joten yksittäisen jakson muutosta ei kannata tulkita trendiksi.</div>`;
}

// ── PWA: Asennuspainike ──────────────────────────────────
// iOS ei tue beforeinstallprompt-tapahtumaa, joten yllä oleva painike ei
// ilmesty iPhonella eika iPadilla koskaan. Naytetaan heille sen sijaan
// lyhyt ohje siita, mista asennus loytyy Safarissa.
function piilotaIosOhje(){
  const b=document.getElementById('ios-hint'); if(b) b.style.display='none';
  try{ localStorage.setItem('iosHintDismissed','1'); }catch(e){}
}
(function(){
  const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const asennettu = window.matchMedia('(display-mode: standalone)').matches
    || navigator.standalone === true;
  let piilotettu = false;
  try{ piilotettu = localStorage.getItem('iosHintDismissed') === '1'; }catch(e){}
  if (iOS && !asennettu && !piilotettu) {
    window.addEventListener('load', () => {
      const b = document.getElementById('ios-hint');
      if (b) b.style.display = 'block';
    });
  }
})();

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('pwa-install-btn');
  if(btn) btn.style.display = 'flex';
  naytaAsennusPainike();
});

window.addEventListener('appinstalled', () => {
  const btn = document.getElementById('pwa-install-btn');
  if(btn) btn.style.display = 'none';
  const hb = document.getElementById('home-install');
  if(hb) hb.style.display = 'none';
  const ih = document.getElementById('ios-hint');
  if(ih) ih.style.display = 'none';
  deferredPrompt = null;
});

// Etusivun asennuspainike. Androidilla ja tyopoydalla se avaa selaimen oman
// asennusikkunan. iOS ei salli asennusta ohjelmallisesti lainkaan, joten
// siella painike avaa ohjeen Jaa-valikon kayttoon.
function onkoIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }

function onkoAsennettu(){
  return window.matchMedia('(display-mode: standalone)').matches
    || navigator.standalone === true;
}

function naytaAsennusPainike(){
  const b = document.getElementById('home-install');
  if (!b) return;
  if (onkoAsennettu()) { b.style.display = 'none'; return; }
  if (deferredPrompt || onkoIOS()) b.style.display = 'inline-block';
}

function asennaSovellus(){
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
    return;
  }
  const b = document.getElementById('ios-hint');
  if (b) { b.style.display = 'block'; try{ localStorage.removeItem('iosHintDismissed'); }catch(e){} }
}

function installPWA() {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
}

// ── PWA: Service Worker ──────────────────────────────────
if('serviceWorker' in navigator) {
  // Huom: service workeria EI voi rekisteroida blob-URLista - selain hylkaa sen.
  // Siksi tama osoittaa oikeaan sw.js-tiedostoon samassa hakemistossa.
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      let reloading = false;
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if(!sw) return;
        sw.addEventListener('statechange', () => {
          if(sw.state === 'installed' && navigator.serviceWorker.controller && !reloading) {
            reloading = true;
            location.reload();
          }
        });
      });
    }).catch(() => {});
  });
}

'Vankiosuuden ja väestöosuuden suhde ei ole rikosriskin mittari. Vankiluvussa ovat mukana myös tutkintavangit, eli henkilöt joita ei ole tuomittu. Osuuteen vaikuttaa myös tuomioiden pituus: pitkää tuomiota istuva näkyy tilastossa vuosia, lyhyttä istuva ei. Lisäksi osa ulkomaalaisista vangeista ei kuulu Suomen vakituiseen väestöön, jolloin heitä ei ole väestöosuuden nimittäjässä lainkaan. Kansalaisuus ei myöskään ole sama asia kuin syntyperä: Suomen kansalaisuuden saanut maahanmuuttaja lasketaan tässä Suomen kansalaiseksi.':'The ratio of prisoner share to population share is not a measure of offending risk. The prisoner figure includes remand prisoners, who have not been convicted. Sentence length also affects the share: someone serving a long sentence appears in the statistic for years, someone serving a short one does not. In addition, some foreign prisoners are not part of the permanent population of Finland, so they are not in the denominator of the population share at all. Citizenship is also not the same as origin: an immigrant who has been granted Finnish citizenship is counted here as a Finnish citizen.'

const DKEYS = Object.keys(DICT).sort((a,b) => b.length - a.length);

// Korvaus tehtiin ennen raakana osajonohakuna, jolloin lyhyt avain osui
// pidemman sanan sisaan: "Seksuaalirikokset" osui sanaan "Seksuaalirikoslaki"
// ja tuotti sekamuodon "Sexual offencesrikoslaki". Siksi kirjaimeen alkava tai
// paattyva avain vaatii nyt sanarajan. Valimerkkiin tai valilyontiin rajautuvat
// avaimet (esim. " rikosta vuodessa.") toimivat ennallaan.
const DKIRJAIN = /[A-Za-zÄÖÅäöåÀ-ÿ]/;
const DRE = new Map(DKEYS.map(k => {
  const esc = k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const alku = DKIRJAIN.test(k[0]) ? '(?<![A-Za-zÄÖÅäöåÀ-ÿ])' : '';
  const loppu = DKIRJAIN.test(k[k.length - 1]) ? '(?![A-Za-zÄÖÅäöåÀ-ÿ])' : '';
  try { return [k, new RegExp(alku + esc + loppu, 'g')]; }
  catch (e) { return [k, new RegExp(esc, 'g')]; }   // lookbehind puuttuu
}));

// Alkuperaiset suomenkieliset tekstit talteen, jotta staattinen valikko ja
// ylapalkki voidaan palauttaa kielta vaihdettaessa. Paneelit renderoidaan
// uudelleen, joten niiden osalta tama on vain varmistus.
const ORIG = new WeakMap();

function translateTree(root){
  if (!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  for (const n of nodes){
    if (LANG === 'fi'){
      if (ORIG.has(n)) n.textContent = ORIG.get(n);
      continue;
    }
    const base = ORIG.has(n) ? ORIG.get(n) : n.textContent;
    if (!/[a-zäöÄÖ]/.test(base)) continue;
    // Lahdekoodin rivinvaihdot ja sisennys eivat nay sivulla, mutta ne jaavat
    // tekstisolmuun ja estaisivat sanakirjan osumat. HTML tiivistaa valilyonnit
    // joka tapauksessa, joten normalisointi ei muuta ulkoasua.
    let t = base.replace(/\s+/g, ' ');
    for (const k of DKEYS){
      if (t.indexOf(k) === -1) continue;
      const re = DRE.get(k);
      re.lastIndex = 0;
      t = t.replace(re, () => DICT[k]);   // funktio, jotta $-merkit eivat tulkitu
    }
    if (t !== n.textContent){
      if (!ORIG.has(n)) ORIG.set(n, base);
      n.textContent = t;
    }
  }
}

function applyLang(){
  translateTree(document.querySelector('.topbar'));
  translateTree(document.querySelector('nav.botnav'));
  translateTree(document.querySelector('.content'));
  const b = document.getElementById('lang-btn');
  if (b) b.textContent = LANG === 'fi' ? 'EN' : 'FI';
  document.documentElement.lang = LANG;
}

function toggleLang(){
  LANG = LANG === 'fi' ? 'en' : 'fi';
  try { localStorage.setItem('lang', LANG); } catch(e) {}
  // Suomeksi palattaessa naytto rakennetaan uudelleen lahdekielesta.
  const active = document.querySelector('.panel.active');
  const id = active ? active.id.replace('p-','') : 'home';
  // Muut paneelit tyhjennetaan, jotta ne rakentuvat lahdekielesta kun niihin
  // seuraavan kerran siirrytaan - muuten niihin jaisi edellisen kielen teksti.
  document.querySelectorAll('.panel').forEach(p => { if (p !== active) p.innerHTML = ''; });
  if (id === 'home'){ if (typeof renderHome === 'function') renderHome(); }
  else if (typeof render === 'function'){ render(id); }
  applyLang();
}

// Renderoinnin jalkeen kaannos ajetaan aina uudelleen.
(function(){
  const wrap = name => {
    const orig = window[name];
    if (typeof orig !== 'function') return;
    window[name] = function(){ const r = orig.apply(this, arguments); applyLang(); return r; };
  };
  ['render','renderHome','go','goHome'].forEach(wrap);
  document.addEventListener('DOMContentLoaded', applyLang);
  if (document.readyState !== 'loading') applyLang();
})();

</script>
