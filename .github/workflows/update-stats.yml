name: Päivitä rikostilastot

on:
  # Ajetaan kuukausittain 20. päivä klo 08:00 UTC.
  # Vuositilastot päivittyvät kerran vuodessa, mutta ennakkotiedot ja
  # työvoimatutkimuksen kuukausisarja päivittyvät kuukausittain. Vuosittainen
  # ajo jätti ne jälkeen.
  schedule:
    - cron: '0 8 20 * *'

  # Mahdollistaa myös manuaalisen ajamisen GitHub-sivulta
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Lataa repositorio
        uses: actions/checkout@v5

      - name: Asenna Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Asenna kirjastot
        run: pip install requests

      - name: Aja testit
        run: python -m unittest discover tests

      # Skripti päättyy virheeseen, jos yksikin haku epäonnistuu tai luku
      # puuttuu. Silloin alla oleva tallennus jää tekemättä ja sivulle jää
      # edellinen ehjä versio.
      - name: Hae uudet tilastot ja päivitä dashboard
        run: python update_stats.py

      - name: Tallenna muutokset GitHubiin
        run: |
          git config user.name "Automaattinen päivitys"
          git config user.email "action@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Automaattinen tilastopäivitys $(date +%Y)"
          git push
